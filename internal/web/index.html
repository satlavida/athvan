<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athvan Preview</title>
<style>
:root {
  --bg: #f4f4f2;
  --panel: #ffffff;
  --ink: #17181a;
  --muted: #6b6e73;
  --line: #e3e3df;
  --field: #f7f7f5;
  --accent: #2a63e8;
  --accent-ink: #ffffff;
  --danger: #c62d22;
  --stage: #e9e9e5;
  --radius: 10px;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214;
    --panel: #18191c;
    --ink: #ececec;
    --muted: #9a9ca1;
    --line: #2a2c30;
    --field: #202226;
    --accent: #6d97ff;
    --accent-ink: #0d1020;
    --danger: #ff7a70;
    --stage: #0b0c0d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  display: grid;
  grid-template-columns: 380px 1fr;
  grid-template-rows: 100%;
}
aside {
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 18px 18px 40px;
}
header.brand { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
header.brand h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
header.brand nav a { color: var(--muted); text-decoration: none; margin-left: 12px; font-size: 13px; }
header.brand nav a:hover { color: var(--ink); }

details { border-top: 1px solid var(--line); padding: 10px 0; }
details > summary {
  cursor: pointer; list-style: none; font-weight: 600; font-size: 13px;
  text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center;
}
details > summary::after { content: "+"; font-weight: 400; font-size: 16px; }
details[open] > summary::after { content: "–"; }
details[open] > summary { margin-bottom: 10px; color: var(--ink); }

.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field > label, .label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.field output { font-variant-numeric: tabular-nums; color: var(--ink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

input[type=text], input[type=url], input[type=number], select, textarea {
  width: 100%; background: var(--field); color: var(--ink);
  border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: inherit;
}
textarea { font: 12px/1.45 var(--mono); resize: vertical; min-height: 90px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 10px; }

.colorfield { display: flex; align-items: center; gap: 8px; }
.colorfield input[type=color] {
  width: 34px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: none; cursor: pointer;
}
.colorfield input[type=text] { font-family: var(--mono); font-size: 12px; }
.colorfield input[type=range] { width: 70px; flex: none; }

.seg { display: flex; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button {
  flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px;
  padding: 5px 6px; border-radius: 6px; cursor: pointer;
}
.seg button[aria-pressed=true] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

button.btn {
  border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; font-size: 13px;
  padding: 6px 11px; border-radius: 7px; cursor: pointer;
}
button.btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.hint { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
.hidden { display: none !important; }

main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; }
.toolbar {
  display: flex; gap: 14px; align-items: center; padding: 10px 18px;
  border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
}
.toolbar .status { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toolbar .status.err { color: var(--danger); }
.stage { background: var(--stage); display: grid; place-items: center; padding: 24px; min-height: 0; overflow: hidden; }
.device {
  position: relative;
  border-radius: var(--corner, 12%) / calc(var(--corner, 12%) * var(--ar, 0.46));
  overflow: hidden; background: #000; box-shadow: 0 0 0 8px #1b1c1e, 0 0 0 9px #3a3b3e, 0 20px 50px rgb(0 0 0 / .35);
  container-type: size;
}
.device img { display: block; width: 100%; height: 100%; object-fit: contain; transition: opacity .15s; }
.device.loading img { opacity: .82; }
.overlay { position: absolute; inset: 0; pointer-events: none; color: rgb(255 255 255 / .92); text-align: center; font-family: -apple-system, "SF Pro Display", Inter, sans-serif; }
.overlay .date { position: absolute; left: 0; right: 0; top: 7.6cqh; font-size: 2.05cqh; font-weight: 600; text-shadow: 0 1px 6px rgb(0 0 0 / .3); }
.overlay .clock { position: absolute; left: 0; right: 0; top: 9.4cqh; font-size: 11.6cqh; font-weight: 700; letter-spacing: -0.02em; line-height: 1; text-shadow: 0 1px 10px rgb(0 0 0 / .25); }
.overlay .island { position: absolute; top: 1.3cqh; left: 50%; transform: translateX(-50%); width: 13cqh; height: 3.9cqh; border-radius: 99px; background: #000; }
.overlay .btns { position: absolute; bottom: 4.5cqh; left: 8cqw; right: 8cqw; display: flex; justify-content: space-between; }
.overlay .btns span { width: 5.6cqh; height: 5.6cqh; border-radius: 50%; background: rgb(40 40 40 / .5); backdrop-filter: blur(10px); }
.overlay .homebar { position: absolute; bottom: 0.9cqh; left: 50%; transform: translateX(-50%); width: 15cqh; height: .6cqh; border-radius: 9px; background: rgb(255 255 255 / .85); }
.device.ipad .overlay .date { top: 6cqh; font-size: 1.6cqh; }
.device.ipad .overlay .clock { top: 7.6cqh; font-size: 9cqh; }
.device.ipad .overlay .island, .device.ipad .overlay .btns { display: none; }
.device.landscape.ipad .overlay .date { top: 7cqh; font-size: 2.2cqh; }
.device.landscape.ipad .overlay .clock { top: 9.4cqh; font-size: 12cqh; }
.safe { position: absolute; left: 0; right: 0; border: 0 dashed rgb(255 214 10 / .9); background: rgb(255 214 10 / .08); }
.safe.top { top: 0; border-bottom-width: 1.5px; }
.safe.bottom { bottom: 0; border-top-width: 1.5px; }

.code {
  border-top: 1px solid var(--line); background: var(--panel); padding: 10px 18px 14px; max-height: 40vh; display: grid; gap: 8px; min-height: 0;
}
.code .tabs { display: flex; gap: 6px; align-items: center; }
.code .tabs .seg { width: auto; }
.code .tabs .seg button { flex: none; padding: 4px 12px; }
.code .tabs .spacer { flex: 1; }
.code pre, .code textarea {
  margin: 0; background: var(--field); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font: 12px/1.5 var(--mono); overflow: auto; max-height: 28vh; white-space: pre-wrap; word-break: break-all;
}
.code textarea { min-height: 160px; }
.code.collapsed pre, .code.collapsed textarea, .code.collapsed .codehint { display: none; }
.codehint { font-size: 12px; color: var(--muted); }

@media (max-width: 860px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
  main { min-height: 100vh; }
  .stage { height: 75vh; }
}
</style>
</head>
<body>
<aside>
  <header class="brand">
    <h1>Athvan</h1>
    <nav><a href="/docs" target="_blank">API docs</a><a href="/openapi.yaml" target="_blank">openapi.yaml</a></nav>
  </header>

  <details open>
    <summary>Device</summary>
    <div class="field"><label for="device">Model</label><select id="device" data-k="device"></select></div>
    <div class="row2">
      <div class="field"><span class="label">Orientation</span>
        <div class="seg" data-k="orientation"><button value="portrait">Portrait</button><button value="landscape">Landscape</button></div></div>
      <div class="field"><span class="label">Format</span>
        <div class="seg" data-k="format"><button value="png">PNG</button><button value="jpeg">JPEG</button></div></div>
    </div>
  </details>

  <details open>
    <summary>Background</summary>
    <div class="field"><div class="seg" data-k="background.type">
      <button value="color">Color</button><button value="gradient">Gradient</button><button value="image">Image</button><button value="bing">Bing</button>
    </div></div>

    <div data-show="background.type=color,gradient">
      <div class="row2">
        <div class="field"><span class="label" data-show="background.type=color">Color</span><span class="label" data-show="background.type=gradient">From</span>
          <div class="colorfield" data-color="background.color"></div></div>
        <div class="field" data-show="background.type=gradient"><span class="label">To</span>
          <div class="colorfield" data-color="background.gradient_to"></div></div>
      </div>
      <div class="field" data-show="background.type=gradient"><label>Angle <output></output></label>
        <input type="range" min="0" max="360" step="5" data-k="background.gradient_angle" data-unit="°"></div>
      <div class="field"><span class="label">Presets</span>
        <div class="seg" id="presets"></div></div>
    </div>

    <div data-show="background.type=image">
      <div class="field"><label for="file">Upload</label><input id="file" type="file" accept="image/*"></div>
      <p class="hint" id="filehint">Resized in the browser to 3200px before sending.</p>
      <div class="field"><label for="imgurl">…or image URL</label><input id="imgurl" type="url" placeholder="https://…" data-k="background.image_url"></div>
    </div>

    <div data-show="background.type=bing">
      <div class="row2">
        <div class="field"><label for="mkt">Market</label>
          <select id="mkt" data-k="background.bing_market">
            <option>en-US</option><option>en-GB</option><option>en-CA</option><option>en-AU</option><option>en-IN</option>
            <option>de-DE</option><option>fr-FR</option><option>es-ES</option><option>it-IT</option><option>ja-JP</option><option>zh-CN</option><option>pt-BR</option>
          </select></div>
        <div class="field"><label>Day <output></output></label>
          <input type="range" min="0" max="7" step="1" data-k="background.bing_index" data-fmt="day"></div>
      </div>
      <label class="check"><input type="checkbox" data-k="background.bing_caption"> Show photo credit</label>
      <p class="hint" id="binginfo"></p>
    </div>

    <div data-show="background.type=image,bing">
      <div class="field"><label>Horizontal crop <output></output></label>
        <input type="range" min="0" max="1" step="0.05" data-k="background.focus_x" data-fmt="pct"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Blur <output></output></label>
        <input type="range" min="0" max="60" step="1" data-k="background.blur" data-unit="pt"></div>
      <div class="field"><label>Dim <output></output></label>
        <input type="range" min="0" max="0.9" step="0.05" data-k="background.dim" data-fmt="pct"></div>
    </div>
  </details>

  <details open>
    <summary>Text</summary>
    <div class="field"><span class="label">Style</span>
      <div class="seg" data-k="style.text_style"><button value="glass">Glass</button><button value="shadow">Shadow</button><button value="plain">Plain</button></div></div>
    <div class="row2">
      <div class="field"><span class="label">Text</span><div class="colorfield" data-color="style.text_color"></div></div>
      <div class="field"><span class="label">Accent</span><div class="colorfield" data-color="style.accent_color"></div></div>
    </div>
    <div class="row2">
      <div class="field"><span class="label">Overdue</span><div class="colorfield" data-color="style.alert_color"></div></div>
      <div class="field"><span class="label">Secondary <small>(blank = auto)</small></span><div class="colorfield" data-color="style.secondary_color" data-optional></div></div>
    </div>
    <div data-show="style.text_style=glass">
      <div class="field"><span class="label">Glass tint &amp; opacity</span><div class="colorfield" data-color="style.glass_tint" data-alpha></div></div>
      <div class="field"><span class="label">Border &amp; opacity</span><div class="colorfield" data-color="style.glass_border" data-alpha></div></div>
      <div class="row2">
        <div class="field"><label>Frost <output></output></label><input type="range" min="0" max="60" step="1" data-k="style.glass_blur" data-unit="pt"></div>
        <div class="field"><label>Corner radius <output></output></label><input type="range" min="0" max="40" step="1" data-k="style.glass_radius" data-unit="pt"></div>
      </div>
    </div>
    <div class="field"><label>Text size <output></output></label>
      <input type="range" min="0.6" max="2" step="0.05" data-k="style.font_scale" data-fmt="x"></div>
    <div class="row2">
      <div class="field"><span class="label">Density</span>
        <div class="seg" data-k="style.density"><button value="compact">Compact</button><button value="comfortable">Comfy</button></div></div>
      <div class="field"><span class="label">Clock</span>
        <div class="seg" data-k="style.time_format"><button value="12h">12h</button><button value="24h">24h</button></div></div>
    </div>
  </details>

  <details>
    <summary>Layout</summary>
    <div class="row2">
      <div class="field"><label>Top clearance <output></output></label>
        <input type="range" min="0" max="0.7" step="0.01" data-k="layout.top" data-fmt="auto-pct"></div>
      <div class="field"><label>Bottom clearance <output></output></label>
        <input type="range" min="0" max="0.5" step="0.01" data-k="layout.bottom" data-fmt="auto-pct"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Side margin <output></output></label>
        <input type="range" min="0" max="80" step="1" data-k="layout.margin" data-unit="pt"></div>
      <div class="field"><label>Max width <output></output></label>
        <input type="range" min="0" max="900" step="10" data-k="layout.width" data-fmt="auto-pt"></div>
    </div>
    <div class="row2">
      <div class="field"><span class="label">Vertical</span>
        <div class="seg" data-k="layout.align"><button value="top">Top</button><button value="center">Mid</button><button value="bottom">Bottom</button></div></div>
      <div class="field"><span class="label">Columns</span>
        <div class="seg" data-k="layout.columns" data-num><button value="0">Auto</button><button value="1">1</button><button value="2">2</button><button value="3">3</button></div></div>
    </div>
  </details>

  <details open>
    <summary>Content</summary>
    <div class="row2">
      <div class="field"><label for="title">Title</label><input id="title" type="text" data-k="title"></div>
      <div class="field"><label for="tz">Timezone</label><input id="tz" type="text" data-k="timezone"></div>
    </div>
    <div class="field"><label for="subtitle">Subtitle</label><input id="subtitle" type="text" data-k="subtitle"></div>
    <div class="field"><label for="events">Events (JSON)</label><textarea id="events" data-k="events" data-type="json" rows="7"></textarea></div>
    <div class="field"><label for="reminders">Reminders (JSON)</label><textarea id="reminders" data-k="reminders" data-type="json" rows="7"></textarea></div>
    <div class="field"><label for="notes">Notes (one per line)</label><textarea id="notes" data-k="notes" data-type="lines" rows="3"></textarea></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <button class="btn" id="sample">Sample for today</button>
      <button class="btn" id="busy">Busy day</button>
      <button class="btn" id="clear">Clear content</button>
    </div>
  </details>
</aside>

<main>
  <div class="toolbar">
    <label class="check" style="margin:0"><input type="checkbox" id="showLock" checked> Lock screen</label>
    <label class="check" style="margin:0"><input type="checkbox" id="showSafe"> Safe areas</label>
    <button class="btn primary" id="download">Download</button>
    <span class="status" id="status">…</span>
  </div>
  <div class="stage">
    <div class="device" id="frame">
      <img id="preview" alt="Wallpaper preview">
      <div class="overlay" id="overlay">
        <div class="island"></div>
        <div class="date" id="ovDate"></div>
        <div class="clock" id="ovClock"></div>
        <div class="btns"><span></span><span></span></div>
        <div class="homebar"></div>
      </div>
      <div class="safe top hidden" id="safeTop"></div>
      <div class="safe bottom hidden" id="safeBottom"></div>
    </div>
  </div>
  <section class="code" id="code">
    <div class="tabs">
      <div class="seg" id="codeTabs">
        <button value="curl" aria-pressed="true">curl</button>
        <button value="json">JSON body</button>
        <button value="get">GET URL</button>
        <button value="shortcut">iOS Shortcut</button>
      </div>
      <span class="spacer"></span>
      <button class="btn hidden" id="applyJson">Apply JSON</button>
      <button class="btn" id="copy">Copy</button>
      <button class="btn" id="toggleCode">Hide</button>
    </div>
    <pre id="codeOut"></pre>
    <textarea id="jsonEdit" class="hidden" spellcheck="false"></textarea>
    <p class="codehint" id="codeHint"></p>
  </section>
</main>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

// ---------------------------------------------------------------- state
const DEFAULTS = {
  device: "iphone-16-pro", orientation: "portrait", format: "png",
  timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
  title: "", subtitle: "", events: [], reminders: [], notes: [],
  background: { type: "gradient", color: "#16222e", gradient_to: "#43325a", gradient_angle: 160,
    image_url: "", image_base64: "", bing_market: "en-US", bing_index: 0, bing_caption: false,
    blur: 0, dim: 0, focus_x: 0.5 },
  style: { text_color: "#ffffff", secondary_color: "", accent_color: "#ff9f0a", alert_color: "#ff453a",
    text_style: "glass", glass_tint: "#0000004d", glass_blur: 30, glass_radius: 22, glass_border: "#ffffff2e",
    font_scale: 1, density: "compact", time_format: "12h" },
  layout: { top: 0, bottom: 0, margin: 16, align: "top", columns: 0, width: 0 },
};
const STORE = "athvan.preview.v1";
let state = structuredClone(DEFAULTS);
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || "null");
  if (saved) state = merge(structuredClone(DEFAULTS), saved);
} catch {}
let devices = [];

function merge(base, over) {
  for (const [k, v] of Object.entries(over || {})) {
    if (v && typeof v === "object" && !Array.isArray(v) && base[k] && typeof base[k] === "object") merge(base[k], v);
    else base[k] = v;
  }
  return base;
}
const get = (path) => path.split(".").reduce((o, k) => o?.[k], state);
function set(path, value) {
  const keys = path.split("."); const last = keys.pop();
  keys.reduce((o, k) => (o[k] ??= {}), state)[last] = value;
}

// Strip values equal to the server defaults so the request stays readable.
const SERVER_DEFAULTS = {
  orientation: "portrait", format: "png",
  background: { type: "color", color: "#101418", gradient_to: "#2a3a5c", gradient_angle: 160, bing_market: "en-US", focus_x: 0.5 },
  style: { text_color: "#ffffff", accent_color: "#ff9f0a", alert_color: "#ff453a", text_style: "glass", glass_tint: "#0000004d",
    glass_blur: 30, glass_radius: 22, glass_border: "#ffffff2e", font_scale: 1, density: "compact", time_format: "12h" },
  layout: { margin: 16, align: "top" },
};
function buildRequest({ forDisplay = false } = {}) {
  const prune = (obj, defs = {}) => {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (v === "" || v === null || v === false || v === 0 && !(k in defs)) continue;
      if (Array.isArray(v)) { if (v.length) out[k] = v; continue; }
      if (typeof v === "object") { const p = prune(v, defs[k] || {}); if (Object.keys(p).length) out[k] = p; continue; }
      if (defs[k] === v) continue;
      out[k] = v;
    }
    return out;
  };
  const r = prune(structuredClone(state), SERVER_DEFAULTS);
  const t = state.background.type;
  if (r.background) {
    if (t !== "image") { delete r.background.image_url; delete r.background.image_base64; }
    if (t === "image" && state.background.image_base64) delete r.background.image_url;
    if (t !== "bing") { delete r.background.bing_market; delete r.background.bing_index; delete r.background.bing_caption; }
    if (t !== "gradient") { delete r.background.gradient_to; delete r.background.gradient_angle; }
    if (t === "image" || t === "bing") delete r.background.color;
    if (t === "color" || t === "gradient") delete r.background.focus_x;
    if (!Object.keys(r.background).length) delete r.background;
  }
  if (r.style && state.style.text_style !== "glass") {
    for (const k of ["glass_tint", "glass_blur", "glass_radius", "glass_border"]) delete r.style[k];
  }
  if (r.device === undefined) r.device = state.device;
  if (forDisplay && r.background?.image_base64) {
    const kb = Math.round(r.background.image_base64.length * 0.75 / 1024);
    r.background.image_base64 = `<${kb} KB image data omitted>`;
  }
  return r;
}

// ---------------------------------------------------------------- controls
function fmt(input, v) {
  const f = input.dataset.fmt, u = input.dataset.unit || "";
  if (f === "pct") return Math.round(v * 100) + "%";
  if (f === "auto-pct") return v == 0 ? "auto" : Math.round(v * 100) + "%";
  if (f === "auto-pt") return v == 0 ? "full" : v + "pt";
  if (f === "x") return Number(v).toFixed(2) + "×";
  if (f === "day") return v == 0 ? "today" : v == 1 ? "yesterday" : v + " days ago";
  return v + u;
}

function buildColorFields() {
  for (const host of $$("[data-color]")) {
    const path = host.dataset.color;
    host.innerHTML = `<input type="color"><input type="text" spellcheck="false">` + (host.hasAttribute("data-alpha") ? `<input type="range" min="0" max="1" step="0.01" title="Opacity">` : "");
    const [pick, text, alpha] = $$("input", host);
    const write = (hex6, a) => {
      let v = hex6;
      if (alpha) v += Math.round(a * 255).toString(16).padStart(2, "0");
      set(path, v); text.value = v; changed();
    };
    pick.addEventListener("input", () => write(pick.value, alpha ? +alpha.value : 1));
    alpha?.addEventListener("input", () => write(pick.value, +alpha.value));
    text.addEventListener("change", () => {
      const v = text.value.trim();
      if (v === "" && host.hasAttribute("data-optional")) { set(path, ""); changed(); return; }
      if (/^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v)) { set(path, v); syncColor(host); changed(); }
      else syncColor(host);
    });
  }
}
function expandHex(v) {
  v = (v || "").replace("#", "");
  if (v.length <= 4) v = [...v].map((c) => c + c).join("");
  return v;
}
function syncColor(host) {
  const [pick, text, alpha] = $$("input", host);
  const v = get(host.dataset.color) || "";
  text.value = v;
  const h = expandHex(v);
  pick.value = h.length >= 6 ? "#" + h.slice(0, 6) : "#ffffff";
  if (alpha) alpha.value = h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1;
}

function bindControls() {
  for (const el of $$("[data-k]")) {
    const path = el.dataset.k;
    if (el.classList.contains("seg")) {
      el.addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        set(path, el.hasAttribute("data-num") ? Number(b.value) : b.value);
        syncAll(); changed();
      });
      continue;
    }
    const ev = el.tagName === "TEXTAREA" || el.type === "text" || el.type === "url" ? "input" : "input";
    el.addEventListener(ev, () => {
      let v;
      if (el.type === "checkbox") v = el.checked;
      else if (el.type === "range" || el.type === "number") v = Number(el.value);
      else if (el.dataset.type === "json") {
        try { v = el.value.trim() ? JSON.parse(el.value) : []; el.style.borderColor = ""; }
        catch { el.style.borderColor = "var(--danger)"; return; }
        if (!Array.isArray(v)) { el.style.borderColor = "var(--danger)"; return; }
      } else if (el.dataset.type === "lines") v = el.value.split("\n").filter((l) => l.trim());
      else v = el.value;
      set(path, v);
      if (el.type === "range") el.closest(".field").querySelector("output").textContent = fmt(el, v);
      if (path === "device") syncAll();
      changed();
    });
  }
}

function syncAll() {
  for (const el of $$("[data-k]")) {
    const v = get(el.dataset.k);
    if (el.classList.contains("seg")) {
      for (const b of $$("button", el)) b.setAttribute("aria-pressed", String(b.value === String(v)));
    } else if (el.type === "checkbox") el.checked = !!v;
    else if (el.dataset.type === "json") { if (document.activeElement !== el) el.value = v?.length ? JSON.stringify(v, null, 2) : ""; }
    else if (el.dataset.type === "lines") { if (document.activeElement !== el) el.value = (v || []).join("\n"); }
    else if (el.type !== "file") el.value = v ?? "";
    if (el.type === "range") el.closest(".field").querySelector("output").textContent = fmt(el, v ?? 0);
  }
  $$("[data-color]").forEach(syncColor);
  for (const el of $$("[data-show]")) {
    const [path, vals] = el.dataset.show.split("=");
    el.classList.toggle("hidden", !vals.split(",").includes(String(get(path))));
  }
  syncFrame();
}

const PRESETS = [
  ["Midnight", "#16222e", "#43325a"], ["Forest", "#0f2a24", "#2f5a3c"], ["Ember", "#2b1416", "#7a3b22"],
  ["Slate", "#1c1f24", "#3b4250"], ["Paper", "#efe9df", "#d9cfbf"],
];
function buildPresets() {
  const host = $("#presets");
  for (const [name, a, b] of PRESETS) {
    const btn = document.createElement("button");
    btn.textContent = name; btn.title = `${a} → ${b}`;
    btn.style.background = `linear-gradient(160deg, ${a}, ${b})`;
    btn.style.color = name === "Paper" ? "#222" : "#fff";
    btn.addEventListener("click", () => {
      set("background.color", a); set("background.gradient_to", b);
      if (name === "Paper") { set("style.text_color", "#1a1a1a"); set("style.glass_tint", "#ffffff66"); set("style.glass_border", "#0000001a"); }
      else if (get("style.text_color") === "#1a1a1a") { set("style.text_color", "#ffffff"); set("style.glass_tint", "#0000004d"); set("style.glass_border", "#ffffff2e"); }
      syncAll(); changed();
    });
    host.append(btn);
  }
}

// ---------------------------------------------------------------- devices & frame
async function loadDevices() {
  const res = await fetch("/v1/devices");
  devices = (await res.json()).devices;
  const sel = $("#device");
  for (const fam of ["iphone", "ipad"]) {
    const g = document.createElement("optgroup"); g.label = fam === "iphone" ? "iPhone" : "iPad";
    for (const d of devices.filter((d) => d.family === fam)) {
      const o = document.createElement("option");
      o.value = d.id; o.textContent = `${d.name} — ${d.width}×${d.height}`;
      g.append(o);
    }
    sel.append(g);
  }
}

function currentDevice() {
  const d = devices.find((d) => d.id === state.device) || devices[0];
  if (!d) return null;
  let w = d.width, h = d.height;
  if (state.orientation === "landscape") [w, h] = [h, w];
  return { ...d, w, h };
}

function syncFrame() {
  const d = currentDevice(); if (!d) return;
  const frame = $("#frame");
  frame.style.aspectRatio = `${d.w} / ${d.h}`;
  frame.style.setProperty("--ar", (d.w / d.h).toFixed(4));
  // Corner radius relative to width: rounder on Face ID iPhones, near-square on iPad.
  const corner = d.family === "ipad" ? 4.2 : d.id === "iphone-se" || d.id === "iphone-8-plus" ? 3 : 13.5;
  frame.style.setProperty("--corner", (state.orientation === "landscape" ? corner * d.h / d.w : corner) + "%");
  fitFrame();
  frame.classList.toggle("ipad", d.family === "ipad");
  frame.classList.toggle("landscape", state.orientation === "landscape");
  frame.classList.toggle("homebutton", d.id === "iphone-se" || d.id === "iphone-8-plus");
  const top = state.layout.top || d.safe_top, bottom = state.layout.bottom || d.safe_bottom;
  $("#safeTop").style.height = top * 100 + "%";
  $("#safeBottom").style.height = bottom * 100 + "%";
  const now = new Date();
  $("#ovDate").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  $("#ovClock").textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: state.style.time_format !== "24h" }).replace(/\s?[AP]M$/i, "");
}

// Size the frame to the largest box of the device's aspect ratio that fits the stage.
function fitFrame() {
  const d = currentDevice(); if (!d) return;
  const stage = $(".stage"), cs = getComputedStyle(stage);
  const sw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 20;
  const sh = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 20;
  const s = Math.max(0, Math.min(sw / d.w, sh / d.h));
  $("#frame").style.width = Math.floor(d.w * s) + "px";
  $("#frame").style.height = Math.floor(d.h * s) + "px";
}
new ResizeObserver(fitFrame).observe(document.querySelector(".stage"));

// ---------------------------------------------------------------- render
let timer, inflight, lastURL, lastBlob;
function changed() {
  try { localStorage.setItem(STORE, JSON.stringify({ ...state, background: { ...state.background, image_base64: "" } })); } catch {}
  renderCode();
  clearTimeout(timer);
  timer = setTimeout(renderImage, 280);
}

async function renderImage() {
  inflight?.abort();
  inflight = new AbortController();
  const status = $("#status"), frame = $("#frame");
  frame.classList.add("loading");
  status.classList.remove("err");
  status.textContent = "Rendering…";
  const t0 = performance.now();
  try {
    const res = await fetch("/v1/wallpaper", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildRequest()), signal: inflight.signal,
    });
    if (!res.ok) {
      const p = await res.json().catch(() => ({}));
      const detail = p.errors?.map((e) => `${e.location ?? ""} ${e.message}`.trim()).join("; ");
      throw new Error(detail || p.detail || res.statusText);
    }
    const blob = await res.blob();
    if (lastURL) URL.revokeObjectURL(lastURL);
    lastURL = URL.createObjectURL(blob); lastBlob = blob;
    $("#preview").src = lastURL;
    const ms = res.headers.get("X-Athvan-Render-Ms");
    status.textContent = `${res.headers.get("X-Athvan-Size")} · ${(blob.size / 1024).toFixed(0)} KB · server ${ms} ms · total ${Math.round(performance.now() - t0)} ms`;
  } catch (e) {
    if (e.name === "AbortError") return;
    status.textContent = e.message; status.classList.add("err");
  } finally {
    frame.classList.remove("loading");
  }
}

// ---------------------------------------------------------------- code panel
let codeTab = "curl";
const b64url = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
function renderCode() {
  const req = buildRequest({ forDisplay: true });
  const body = JSON.stringify(req, null, 2);
  const origin = location.origin;
  const out = $("#codeOut"), hint = $("#codeHint"), edit = $("#jsonEdit");
  out.classList.toggle("hidden", codeTab === "json");
  edit.classList.toggle("hidden", codeTab !== "json");
  $("#applyJson").classList.toggle("hidden", codeTab !== "json");
  hint.textContent = "";
  if (codeTab === "curl") {
    out.textContent = `curl -sS -X POST '${origin}/v1/wallpaper' \\\n  -H 'Content-Type: application/json' \\\n  -o wallpaper.${state.format === "jpeg" ? "jpg" : "png"} \\\n  -d '${JSON.stringify(req).replace(/'/g, "'\\''")}'`;
    if (req.background?.image_base64) hint.textContent = "The uploaded image is omitted here. Put the real base64 in the body, or use image_url.";
  } else if (codeTab === "json") {
    if (document.activeElement !== edit) edit.value = body;
    hint.textContent = "Edit the body and press Apply JSON to load it into the controls. Paste the JSON your Shortcut sends to debug it.";
  } else if (codeTab === "get") {
    const r = buildRequest(); delete r.background?.image_base64;
    out.textContent = `${origin}/v1/wallpaper?config=${b64url(JSON.stringify(r))}`;
    hint.textContent = "A fixed URL with everything baked in. Good for a static look; POST is better for daily events and reminders." + (state.background.image_base64 ? " The uploaded image is not included; use image_url." : "");
  } else {
    out.textContent = [
      "Shortcut: “Daily wallpaper” (run it from a Personal Automation, e.g. every morning at 6:00)",
      "",
      "1. Find Calendar Events where Start Date is today → Repeat with each:",
      "     Dictionary { title: Title, start: Start Date (ISO 8601), end: End Date (ISO 8601),",
      "                  all_day: Is All Day, location: Location }  → Add to variable Events",
      "2. Find Reminders where Is Not Completed → Repeat with each:",
      "     Dictionary { title: Title, due: Due Date (ISO 8601), priority: 0-3, list: List }",
      "     → Add to variable Reminders",
      "3. Dictionary (this body, with events = Events and reminders = Reminders):",
      "",
      body.split("\n").map((l) => "     " + l).join("\n"),
      "",
      `4. Get Contents of URL  ${origin}/v1/wallpaper  · Method POST · Request Body JSON (the dictionary)`,
      "5. Set Wallpaper → Lock Screen  (turn off “Show Preview” to run unattended; also turn off Legibility Blur)",
    ].join("\n");
    hint.textContent = "The server must be reachable from the phone. Deploy it, or use your Mac/PC's LAN address.";
  }
}

function initCodePanel() {
  $("#codeTabs").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    codeTab = b.value;
    for (const x of $$("#codeTabs button")) x.setAttribute("aria-pressed", String(x === b));
    renderCode();
  });
  $("#copy").addEventListener("click", async () => {
    const text = codeTab === "json" ? $("#jsonEdit").value : $("#codeOut").textContent;
    await navigator.clipboard.writeText(text);
    $("#copy").textContent = "Copied"; setTimeout(() => ($("#copy").textContent = "Copy"), 1200);
  });
  $("#applyJson").addEventListener("click", () => {
    try {
      const parsed = JSON.parse($("#jsonEdit").value);
      const keepImage = state.background.image_base64;
      state = merge(structuredClone(DEFAULTS), parsed);
      if (String(state.background.image_base64).startsWith("<")) state.background.image_base64 = keepImage;
      syncAll(); changed();
      $("#jsonEdit").style.borderColor = "";
    } catch (e) {
      $("#jsonEdit").style.borderColor = "var(--danger)";
      $("#codeHint").textContent = "Invalid JSON: " + e.message;
    }
  });
  $("#toggleCode").addEventListener("click", () => {
    const c = $("#code").classList.toggle("collapsed");
    $("#toggleCode").textContent = c ? "Show" : "Hide";
  });
}

// ---------------------------------------------------------------- sample data
function iso(d) {
  const pad = (n) => String(n).padStart(2, "0");
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? "+" : "-";
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00${sign}${pad(Math.floor(Math.abs(off) / 60))}:${pad(Math.abs(off) % 60)}`;
}
function dateOnly(d) { return iso(d).slice(0, 10); }
function at(dayOffset, h, m = 0) { const d = new Date(); d.setDate(d.getDate() + dayOffset); d.setHours(h, m, 0, 0); return d; }

function sample(busy) {
  const ev = (day, h, m, mins, title, extra = {}) => ({ title, start: iso(at(day, h, m)), end: iso(new Date(at(day, h, m).getTime() + mins * 60000)), ...extra });
  state.title = busy ? "" : "Ship the beta";
  state.subtitle = busy ? "" : "3 days to launch";
  state.events = [
    { title: "Mom's birthday", start: dateOnly(at(0, 0)), all_day: true, color: "#ff375f" },
    ev(0, 8, 30, 30, "Standup", { location: "Zoom", color: "#0a84ff", calendar: "Work" }),
    ev(0, 10, 0, 60, "Design review: onboarding flow", { location: "Room 4B", color: "#0a84ff", calendar: "Work" }),
    ev(0, 12, 30, 60, "Lunch with Priya", { location: "Tartine", color: "#30d158", calendar: "Personal" }),
    ev(0, 15, 0, 45, "1:1 with Alex", { color: "#0a84ff", calendar: "Work" }),
    ev(0, 18, 30, 90, "Climbing", { location: "Mission Cliffs", color: "#30d158", calendar: "Personal" }),
    ev(1, 9, 0, 120, "Quarterly planning", { location: "Main hall", color: "#0a84ff", calendar: "Work" }),
    ev(1, 19, 0, 120, "Dinner at Nopa", { color: "#30d158", calendar: "Personal" }),
  ];
  state.reminders = [
    { title: "Renew passport", due: dateOnly(at(-2, 0)), priority: 2, list: "Admin" },
    { title: "Send invoice #1042", due: iso(at(0, 17)), flagged: true, list: "Work" },
    { title: "Pick up dry cleaning", due: dateOnly(at(0, 0)), list: "Errands" },
    { title: "Book flights for December", due: dateOnly(at(3, 0)), priority: 1, list: "Travel" },
    { title: "Water the plants", done: true, list: "Home" },
  ];
  state.notes = busy ? [] : ["Wi-Fi at the office: guest / sunflower42"];
  if (busy) {
    for (let i = 0; i < 6; i++) state.events.push(ev(0, 11 + (i % 6), 15, 15, ["Check-in", "Interview: backend", "Vendor call", "Code review", "Hiring sync", "Ops review"][i], { color: "#bf5af2", calendar: "Work" }));
    for (let i = 0; i < 6; i++) state.reminders.push({ title: ["Reply to legal", "Update roadmap doc", "Order team swag", "File expenses", "Read RFC 112", "Call plumber"][i], due: dateOnly(at(i % 3, 0)) });
  }
  syncAll(); changed();
}

// ---------------------------------------------------------------- image upload & bing info
function initImage() {
  $("#file").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const img = await createImageBitmap(f);
    const max = 3200, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", 0.9);
    set("background.image_base64", url.slice(url.indexOf(",") + 1));
    $("#filehint").textContent = `${f.name} → ${c.width}×${c.height}, ${Math.round(url.length * 0.75 / 1024)} KB`;
    changed();
  });
  $("#imgurl").addEventListener("input", () => { if (state.background.image_url) { set("background.image_base64", ""); $("#file").value = ""; } });
}
let bingKey = "";
async function bingInfo() {
  if (state.background.type !== "bing") return;
  const key = state.background.bing_market + "/" + state.background.bing_index;
  if (key === bingKey) return; bingKey = key;
  try {
    const r = await fetch(`/v1/bing?market=${encodeURIComponent(state.background.bing_market)}&index=${state.background.bing_index}`);
    const b = await r.json();
    $("#binginfo").textContent = r.ok ? `${b.title} — ${b.copyright}` : (b.detail || "Bing unavailable");
  } catch { $("#binginfo").textContent = "Bing unavailable"; }
}

// ---------------------------------------------------------------- boot
(async function boot() {
  buildColorFields();
  buildPresets();
  bindControls();
  initCodePanel();
  initImage();
  $("#sample").addEventListener("click", () => sample(false));
  $("#busy").addEventListener("click", () => sample(true));
  $("#clear").addEventListener("click", () => { Object.assign(state, { title: "", subtitle: "", events: [], reminders: [], notes: [] }); syncAll(); changed(); });
  $("#showLock").addEventListener("change", (e) => $("#overlay").classList.toggle("hidden", !e.target.checked));
  $("#showSafe").addEventListener("change", (e) => { $("#safeTop").classList.toggle("hidden", !e.target.checked); $("#safeBottom").classList.toggle("hidden", !e.target.checked); });
  $("#download").addEventListener("click", () => {
    if (!lastBlob) return;
    const a = document.createElement("a");
    a.href = lastURL; a.download = `wallpaper-${state.device}.${state.format === "jpeg" ? "jpg" : "png"}`; a.click();
  });
  const origChanged = changed;
  changed = () => { origChanged(); bingInfo(); };
  await loadDevices();
  if (!state.events.length && !state.reminders.length && !localStorage.getItem(STORE)) sample(false);
  syncAll(); changed();
})();
</script>
