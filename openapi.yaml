components:
  schemas:
    Background:
      additionalProperties: false
      properties:
        bing_caption:
          description: Print the Bing photo credit in small text above the bottom safe area.
          type: boolean
        bing_index:
          description: 0 = today, 1 = yesterday, up to 7 days back.
          format: int64
          maximum: 7
          minimum: 0
          type: integer
        bing_market:
          default: en-US
          description: Bing market, e.g. en-US, en-GB, ja-JP, de-DE.
          examples:
            - en-US
          type: string
        blur:
          description: Gaussian blur over the whole background, in points.
          format: double
          maximum: 100
          minimum: 0
          type: number
        color:
          default: "#101418"
          description: Background colour, and gradient start colour.
          examples:
            - "#101418"
          pattern: ^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
        dim:
          description: Darken the background (0 = none, 1 = black). Helps contrast on busy photos.
          format: double
          maximum: 1
          minimum: 0
          type: number
        focus_x:
          default: 0.5
          description: Horizontal crop anchor for images (0 = left edge, 1 = right edge).
          format: double
          maximum: 1
          minimum: 0
          type: number
        gradient_angle:
          default: 160
          description: Gradient direction in degrees (0 = upwards, 90 = to the right).
          format: double
          maximum: 360
          minimum: 0
          type: number
        gradient_to:
          default: "#2a3a5c"
          description: Gradient end colour.
          pattern: ^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
        image_base64:
          description: "Base64 image data (a data: URL prefix is accepted). Takes precedence over image_url."
          type: string
        image_url:
          description: http(s) URL of a JPEG/PNG/GIF image. Cover-cropped to the screen.
          format: uri
          type: string
        type:
          default: color
          description: "color: solid fill. gradient: two-colour linear gradient. image: image_url or image_base64. bing: Bing image of the day."
          enum:
            - color
            - gradient
            - image
            - bing
          type: string
      type: object
    BingImage:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BingImage.json
          format: uri
          readOnly: true
          type: string
        copyright:
          examples:
            - Seceda ridge, Italy (© Example/Getty Images)
          type: string
        date:
          description: Bing start date, YYYYMMDD
          examples:
            - "20261014"
          type: string
        link:
          description: Bing's info page for the photo
          type: string
        title:
          examples:
            - Autumn in the Dolomites
          type: string
        url:
          description: Full-resolution image URL
          examples:
            - https://www.bing.com/th?id=OHR.Example_UHD.jpg
          type: string
      required:
        - title
        - copyright
        - date
        - url
      type: object
    Device:
      additionalProperties: false
      properties:
        family:
          description: Device family
          enum:
            - iphone
            - ipad
          type: string
        height:
          description: Native portrait height in pixels
          examples:
            - 2622
          format: int64
          type: integer
        id:
          description: Preset identifier used in requests
          examples:
            - iphone-16-pro
          type: string
        name:
          description: Human readable model names
          examples:
            - iPhone 16 Pro, iPhone 17, iPhone 17 Pro
          type: string
        safe_bottom:
          description: Default fraction of height reserved at the bottom for lock-screen controls
          examples:
            - 0.13
          format: double
          type: number
        safe_top:
          description: Default fraction of height reserved at the top for the lock-screen clock
          examples:
            - 0.33
          format: double
          type: number
        scale:
          description: Pixels per point
          examples:
            - 3
          format: double
          type: number
        width:
          description: Native portrait width in pixels
          examples:
            - 1206
          format: int64
          type: integer
      required:
        - id
        - name
        - family
        - width
        - height
        - scale
        - safe_top
        - safe_bottom
      type: object
    DevicesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DevicesOutputBody.json
          format: uri
          readOnly: true
          type: string
        devices:
          items:
            $ref: "#/components/schemas/Device"
          type:
            - array
            - "null"
      required:
        - devices
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        all_day:
          description: All-day event. Implied when start is a plain date.
          type: boolean
        calendar:
          description: Calendar name, shown in comfortable density.
          maxLength: 100
          type: string
        color:
          description: Calendar colour for the leading bar. Defaults to the accent colour.
          examples:
            - "#0a84ff"
          pattern: ^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
        end:
          description: RFC 3339 date-time, or YYYY-MM-DD.
          type: string
        location:
          examples:
            - Room 4B
          maxLength: 300
          type: string
        start:
          description: RFC 3339 date-time, or YYYY-MM-DD for all-day events.
          examples:
            - "2026-10-14T10:00:00-07:00"
          type: string
        title:
          examples:
            - Design review
          maxLength: 300
          minLength: 1
          type: string
      required:
        - title
        - start
      type: object
    Layout:
      additionalProperties: false
      properties:
        align:
          default: top
          description: Vertical placement of the content inside the free area.
          enum:
            - top
            - center
            - bottom
          type: string
        bottom:
          description: Fraction of height kept clear at the bottom. 0 uses the device default.
          format: double
          maximum: 0.9
          minimum: 0
          type: number
        columns:
          description: "Card columns. 0 picks automatically: 1 on iPhone, 2 when the screen is at least 600 points wide."
          format: int64
          maximum: 3
          minimum: 0
          type: integer
        margin:
          default: 16
          description: Side margin, in points.
          format: double
          maximum: 200
          minimum: 0
          type: number
        top:
          description: Fraction of height kept clear at the top. 0 uses the device default, which clears the lock-screen clock.
          format: double
          maximum: 0.9
          minimum: 0
          type: number
        width:
          description: Maximum content width in points; the block is centred. 0 = full width.
          format: double
          maximum: 2000
          minimum: 0
          type: number
      type: object
    Reminder:
      additionalProperties: false
      properties:
        done:
          description: Completed reminders are drawn struck through and sorted last.
          type: boolean
        due:
          description: RFC 3339 date-time, or YYYY-MM-DD.
          examples:
            - "2026-10-14T17:00:00-07:00"
          type: string
        flagged:
          type: boolean
        list:
          description: List name, shown in comfortable density.
          maxLength: 100
          type: string
        priority:
          description: 0 none, 1 low (!), 2 medium (!!), 3 high (!!!).
          format: int64
          maximum: 3
          minimum: 0
          type: integer
        title:
          examples:
            - Call the dentist
          maxLength: 300
          minLength: 1
          type: string
      required:
        - title
      type: object
    Style:
      additionalProperties: false
      properties:
        accent_color:
          default: "#ff9f0a"
          description: In-progress events, flags, priorities.
          pattern: ^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
        alert_color:
          default: "#ff453a"
          description: Overdue reminders.
          pattern: ^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
        density:
          default: compact
          description: "compact: one line per item, the most information per glance. comfortable: larger type with locations and lists on a second line."
          enum:
            - compact
            - comfortable
          type: string
        font_scale:
          default: 1
          description: Multiplier on every text size.
          format: double
          maximum: 2.5
          minimum: 0.5
          type: number
        glass_blur:
          default: 30
          description: Frost strength, in points.
          format: double
          maximum: 80
          minimum: 0
          type: number
        glass_border:
          default: "#ffffff2e"
          description: Hairline border colour. Fully transparent disables it.
          pattern: ^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
        glass_radius:
          default: 22
          description: Card corner radius, in points.
          format: double
          maximum: 60
          minimum: 0
          type: number
        glass_tint:
          default: "#0000004d"
          description: Colour laid over the frosted area. Use alpha (#RRGGBBAA).
          pattern: ^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
        secondary_color:
          description: Times, headings and meta text. Defaults to text_color at 65% opacity.
          pattern: ^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
        text_color:
          default: "#ffffff"
          description: Primary text colour.
          pattern: ^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type: string
        text_style:
          default: glass
          description: "glass: frosted cards behind each section. shadow: no cards, soft drop shadow. plain: text only."
          enum:
            - glass
            - shadow
            - plain
          type: string
        time_format:
          default: 12h
          description: Clock format for times.
          enum:
            - 12h
            - 24h
          type: string
      type: object
    WallpaperRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WallpaperRequest.json
          format: uri
          readOnly: true
          type: string
        background:
          $ref: "#/components/schemas/Background"
        device:
          default: iphone-16-pro
          description: Device preset id. See GET /v1/devices.
          enum:
            - iphone-se
            - iphone-11
            - iphone-8-plus
            - iphone-13-mini
            - iphone-11-pro
            - iphone-14
            - iphone-15
            - iphone-16-pro
            - iphone-11-pro-max
            - iphone-air
            - iphone-14-plus
            - iphone-15-plus
            - iphone-16-pro-max
            - ipad-mini
            - ipad-10-2
            - ipad-10-9
            - ipad-pro-11
            - ipad-pro-11-m4
            - ipad-pro-12-9
            - ipad-pro-13-m4
          examples:
            - iphone-16-pro
          type: string
        events:
          description: Calendar events. Past days are dropped; events are grouped by day.
          items:
            $ref: "#/components/schemas/Event"
          maxItems: 200
          type:
            - array
            - "null"
        format:
          default: png
          description: Output image format.
          enum:
            - png
            - jpeg
          type: string
        height:
          description: Custom height in pixels.
          format: int64
          maximum: 6000
          minimum: 0
          type: integer
        layout:
          $ref: "#/components/schemas/Layout"
        notes:
          description: Free text lines, word-wrapped.
          items:
            type: string
          maxItems: 50
          type:
            - array
            - "null"
        now:
          description: Reference time (RFC 3339) for Today/Tomorrow labels and overdue checks. Defaults to the current time.
          format: date-time
          type: string
        orientation:
          default: portrait
          description: Landscape swaps width and height; useful for iPad.
          enum:
            - portrait
            - landscape
          type: string
        quality:
          default: 92
          description: JPEG quality.
          format: int64
          maximum: 100
          minimum: 0
          type: integer
        reminders:
          description: Reminders / to-dos.
          items:
            $ref: "#/components/schemas/Reminder"
          maxItems: 200
          type:
            - array
            - "null"
        scale:
          description: Pixels per point for a custom size (default 3).
          format: double
          maximum: 4
          minimum: 0
          type: number
        sections:
          description: Order of the cards. Defaults to events, reminders, notes.
          items:
            enum:
              - events
              - reminders
              - notes
            type: string
          type:
            - array
            - "null"
        style:
          $ref: "#/components/schemas/Style"
        subtitle:
          description: Optional line under the title.
          maxLength: 300
          type: string
        timezone:
          description: IANA zone used to display times and group events by day. Defaults to the server's zone.
          examples:
            - America/Los_Angeles
          type: string
        title:
          description: Optional large heading shown above the cards.
          examples:
            - "Focus: ship v1"
          maxLength: 200
          type: string
        width:
          description: Custom width in pixels. Overrides the device preset when set together with height.
          format: int64
          maximum: 6000
          minimum: 0
          type: integer
      type: object
info:
  description: |-
    Renders lock-screen wallpapers for iPhone and iPad with your calendar events, reminders and notes drawn on a photo, the Bing image of the day, a gradient or a solid colour.

    Typical use: an iOS Shortcut builds the JSON body from Calendar and Reminders, POSTs it to /v1/wallpaper, and passes the returned image to *Set Wallpaper*.
  title: Athvan Wallpaper API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/bing:
    get:
      description: "Title, credit and URL of the Bing image used by `background.type: bing`."
      operationId: get-bing-image
      parameters:
        - description: Bing market, e.g. en-US, en-GB, ja-JP.
          explode: false
          in: query
          name: market
          schema:
            default: en-US
            description: Bing market, e.g. en-US, en-GB, ja-JP.
            type: string
        - description: 0 = today, up to 7 days back.
          explode: false
          in: query
          name: index
          schema:
            description: 0 = today, up to 7 days back.
            format: int64
            maximum: 7
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BingImage"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Bing image of the day
      tags:
        - Reference
  /v1/devices:
    get:
      description: Every iPhone and iPad screen size the renderer knows, with native resolution and the default safe areas around the lock-screen clock and controls.
      operationId: list-devices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List device presets
      tags:
        - Reference
  /v1/wallpaper:
    get:
      description: Same as the POST, with the body passed as base64url JSON in `config`. Handy for a bookmark or a static configuration; use POST for daily data.
      operationId: render-wallpaper-get
      parameters:
        - description: Base64url-encoded (no padding needed) JSON of the same body accepted by POST /v1/wallpaper.
          explode: false
          in: query
          name: config
          schema:
            description: Base64url-encoded (no padding needed) JSON of the same body accepted by POST /v1/wallpaper.
            type: string
        - description: Shortcut for config.device; overrides it when set.
          explode: false
          in: query
          name: device
          schema:
            description: Shortcut for config.device; overrides it when set.
            type: string
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
            image/png:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The rendered wallpaper.
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            X-Athvan-Bing-Credit:
              schema:
                description: Photo credit when a Bing image was used
                type: string
            X-Athvan-Device:
              schema:
                description: Device preset used
                type: string
            X-Athvan-Render-Ms:
              schema:
                description: Server render time
                format: int64
                type: integer
            X-Athvan-Size:
              schema:
                description: Rendered size, WIDTHxHEIGHT
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Render a wallpaper from a URL
      tags:
        - Wallpaper
    post:
      description: Returns a PNG (or JPEG) sized for the chosen device. Everything in the body is optional.
      operationId: render-wallpaper
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WallpaperRequest"
        required: true
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
            image/png:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The rendered wallpaper.
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            X-Athvan-Bing-Credit:
              schema:
                description: Photo credit when a Bing image was used
                type: string
            X-Athvan-Device:
              schema:
                description: Device preset used
                type: string
            X-Athvan-Render-Ms:
              schema:
                description: Server render time
                format: int64
                type: integer
            X-Athvan-Size:
              schema:
                description: Rendered size, WIDTHxHEIGHT
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Render a wallpaper
      tags:
        - Wallpaper
